name: ae32k_shader_compiler
description: Compiler for the Scion shader language targeting the AE32000 (EISC) core inside the MDIN-6xx. Pure Dart, runs as a CLI and inside the Scion controller app.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.6.0

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0

# examples assets (written by tool/sync_examples.dart): the IDE loads them as
# packages/ae32k_shader_compiler/examples/...
flutter:
  assets:
    - examples/
    - examples/cal/
    - examples/corpus/
    - examples/ddr/
    - examples/ddr/bin/
    - examples/grad/
    - examples/pip/
    - examples/pix/
    - examples/shapes/
    - examples/showcase/
    - examples/tpg/
